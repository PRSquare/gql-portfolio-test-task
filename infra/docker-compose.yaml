name: gql-portfolio-tst-task

services:
  db:
    image: postgres:18
    container_name: db
    restart: always
    env_file:
      - ../.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
      
  app:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    ports:
      - 3000:3000
    depends_on:
      - db
